name: Live SDK check

on:
  workflow_dispatch:
    inputs:
      qonversion_project_key:
        description: Client SDK project key, not the sk_ secret. Empty uses the test environment secret.
        required: false
        type: string
      qonversion_no_code_context_key:
        description: No-Codes context key. Empty uses the test environment secret.
        required: false
        type: string
  push:
    branches:
      - main
      # GitHub only dispatches a workflow that already exists on the default
      # branch. This branch is how the real SDK check runs before that merge.
      - test/qonversion-remote-config-ios

permissions:
  contents: read

concurrency:
  group: remote-config-e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: example

jobs:
  e2e:
    name: ${{ matrix.case }}
    environment: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: android
            os: ubuntu-24.04
            target: x86_64-linux-android
          - case: ios
            os: macos-15
            target: aarch64-apple-ios-sim
    env:
      QONVERSION_PROJECT_KEY: ${{ inputs.qonversion_project_key || secrets.QONVERSION_PROJECT_KEY }}
      QONVERSION_NO_CODE_CONTEXT_KEY: ${{ inputs.qonversion_no_code_context_key || secrets.QONVERSION_NO_CODE_CONTEXT_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: example
          key: ${{ matrix.case }}

      - uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        run: cargo binstall -y dioxus-cli@0.7.10

      - name: Install Java
        if: matrix.case == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The host build of the example app for `cargo test` links WebKitGTK.
      - name: Install WebKitGTK
        if: matrix.case == 'android'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev

      - name: Enable KVM
        if: matrix.case == 'android'
        run: test -c /dev/kvm && sudo chmod 666 /dev/kvm

      - name: Live test on Android
        if: matrix.case == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader
          working-directory: example
          script: cargo test -- --ignored --nocapture android

      - name: Boot iOS Simulator
        if: matrix.case == 'ios'
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -E -o "[0-9A-F-]{36}")
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Live test on iOS
        if: matrix.case == 'ios'
        run: cargo test -- --ignored --nocapture ios
