name: Native Remote Config

on:
  push:
    branches:
      - test/qonversion-remote-config-ios

permissions:
  contents: read

concurrency:
  group: native-remote-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Native Rust SDK - iOS
    if: github.event_name == 'push' && github.ref == 'refs/heads/test/qonversion-remote-config-ios'
    runs-on: macos-15
    environment: test
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Configure Xcode and XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version
          python3 -c 'import re, subprocess; v=subprocess.check_output(["xcodegen", "--version"], text=True); m=re.search(r"(\d+)\.(\d+)", v); assert m and tuple(map(int,m.groups())) >= (2,46), "XcodeGen >= 2.46 required"'
      - name: Select Rust Simulator target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) target=aarch64-apple-ios-sim ;;
            x86_64) target=x86_64-apple-ios ;;
            *) exit 1 ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.target.outputs.target }}
      - name: Check runner regressions
        run: python3 -B -m unittest discover -s integration-tests/native-remote-config -p 'test_*.py' -v
      - name: Boot iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for runtime,items in data["devices"].items() if "iOS-18-5" in runtime for d in items if d.get("isAvailable") and d["name"].startswith("iPhone")]; assert devices, "iOS 18.5 iPhone Simulator missing"; print(devices[0]["udid"])')
          state=$(xcrun simctl list devices -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["state"] for items in d["devices"].values() for x in items if x["udid"]==sys.argv[1]))' "$device")
          if [ "$state" != Booted ]; then xcrun simctl boot "$device"; fi
          xcrun simctl bootstatus "$device" -b
          echo "device=$device" >> "$GITHUB_OUTPUT"
      # No build caches. The Project Key is provided only to this execution step.
      - name: Execute real Rust Swift SDK test
        id: native
        env:
          QONVERSION_PROJECT_KEY: ${{ secrets.QONVERSION_PROJECT_KEY }}
        run: python3 -B integration-tests/native-remote-config/ci.py ios --device '${{ steps.simulator.outputs.device }}'
      - name: Upload only validated sanitized diagnostics
        if: always() && steps.native.outputs.safe_artifacts != ''
        uses: actions/upload-artifact@v4
        with:
          name: native-remote-config-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.native.outputs.safe_artifacts }}
          if-no-files-found: error
          retention-days: 7
      - name: Stop Simulator
        if: always() && steps.simulator.outputs.device != ''
        run: xcrun simctl shutdown '${{ steps.simulator.outputs.device }}'

  android:
    name: Native Rust SDK - Android
    if: github.event_name == 'push' && github.ref == 'refs/heads/test/qonversion-remote-config-ios'
    runs-on: ubuntu-24.04
    environment: test
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"
          cache-disabled: true
          dependency-graph: disabled
          add-job-summary: never
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-34' 'build-tools;34.0.0' 'ndk;29.0.14206865' 'system-images;android-34;google_apis;x86_64'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          java -version
          gradle --version
      - name: Check runner regressions
        run: python3 -B -m unittest discover -s integration-tests/native-remote-config -p 'test_*.py' -v
      - name: Boot Android Emulator without UI
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd --force --name native-remote-config --package 'system-images;android-34;google_apis;x86_64'
          nohup "$ANDROID_HOME/emulator/emulator" -avd native-remote-config -port 5554 -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/native-emulator-private.log" 2>&1 &
          timeout 300 adb -s emulator-5554 wait-for-device
          booted=false
          for attempt in $(seq 1 150); do
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then booted=true; break; fi
            sleep 2
          done
          test "$booted" = true
      - name: Execute real Rust Kotlin SDK test
        id: native
        env:
          QONVERSION_PROJECT_KEY: ${{ secrets.QONVERSION_PROJECT_KEY }}
        run: python3 -B integration-tests/native-remote-config/ci.py android --device emulator-5554
      - name: Upload only validated sanitized diagnostics
        if: always() && steps.native.outputs.safe_artifacts != ''
        uses: actions/upload-artifact@v4
        with:
          name: native-remote-config-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.native.outputs.safe_artifacts }}
          if-no-files-found: error
          retention-days: 7
      - name: Stop Emulator
        if: always()
        run: adb -s emulator-5554 emu kill
