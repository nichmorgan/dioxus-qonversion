name: NativeRemoteConfig
options:
  deploymentTarget:
    iOS: "15.0"
packages:
  QonversionHost:
    path: ../../../ios
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  NativeRemoteConfig:
    type: application
    platform: iOS
    sources: [AppDelegate.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.dioxus.qonversion.nativetest
    dependencies:
      - package: QonversionHost
        product: DioxusQonversionHost
  NativeRemoteConfigTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RemoteConfigTests.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.dioxus.qonversion.nativetest.tests
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/TestBridge.h
        # A Rust .a is a linker input, not a framework searched with -F.
        # Absolute quoted path also handles spaces and avoids choosing a dylib.
        OTHER_LDFLAGS:
          - $(inherited)
          - '"${RUST_LIBRARY}"'
          - $(RUST_NATIVE_LIBS)
    dependencies:
      - target: NativeRemoteConfig
schemes:
  NativeRemoteConfig:
    build:
      targets:
        NativeRemoteConfig: all
        NativeRemoteConfigTests: [test]
    test:
      targets: [NativeRemoteConfigTests]
      gatherCoverageData: false
